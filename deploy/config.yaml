# Single place to choose the model. Both the Ollama pod (which pulls it at
# startup) and the DocuMind app (which calls it) read this value.
apiVersion: v1
kind: ConfigMap
metadata:
  name: documind-llm
  labels:
    app.kubernetes.io/part-of: documind
data:
  # Sized for the hackathon team quota (4 CPU / 8Gi requests per namespace,
  # 2 CPU / 4Gi per container). qwen2.5:7b needs more than the 4Gi
  # per-container cap, so it cannot run here. "qwen2.5:1.5b" is the lighter
  # fallback if qwen2.5:3b is too slow or runs out of memory.
  OLLAMA_MODEL: "qwen2.5:3b"
  # Only reachable inside the namespace (ClusterIP Service in ollama.yaml).
  OLLAMA_BASE_URL: "http://ollama:11434"
