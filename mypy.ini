# mypy (type-check) config for DocuMind. Run via scripts/validate.sh.
[mypy]
python_version = 3.12
# CI and validate.sh do not install the heavy runtime deps (docling, torch,
# RapidOCR, fastapi, ...), so imports of third-party packages resolve to Any.
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = True
warn_redundant_casts = True
check_untyped_defs = True
